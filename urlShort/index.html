<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 단축기 - 스마트 링크 단축 서비스</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 마우스 반응형 인터랙티브 그라데이션 배경 -->
  <div class="interactive-bg" id="interactiveBg" aria-hidden="true">
    <div class="gradient-mesh"></div>
    <div class="glow-orb orb-primary" id="orbPrimary"></div>
    <div class="glow-orb orb-secondary" id="orbSecondary"></div>
    <div class="glow-orb orb-tertiary" id="orbTertiary"></div>
  </div>

  <!-- 상단 네비게이션 헤더 -->
  <header class="header">
    <div class="header-left">
      <a href="../index.html" class="logo-link" title="메인 홈으로 이동">
        <img src="../url2qr/img/logo.png" alt="LinkHub Logo" class="logo-img">
        <span class="logo-badge">URL Shortener</span>
      </a>
    </div>

    <!-- 1 & 2 요구사항: QR코드 버튼과 URL단축 버튼 상단 탭 -->
    <nav class="nav-menu" aria-label="메인 메뉴">
      <a href="../index.html" class="nav-btn" title="전체 서비스 홈">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>홈</span>
      </a>
      <a href="../url2qr/index.html" class="nav-btn" title="QR코드 생성기로 이동">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>QR코드</span>
      </a>
      <a href="index.html" class="nav-btn active" aria-current="page" title="현재 페이지: URL 단축">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>URL단축</span>
      </a>
    </nav>
  </header>

  <!-- 메인 영역 -->
  <main class="main-container">
    <div class="shortener-card">
      <!-- 헤딩 소개 -->
      <div class="card-intro">
        <div class="service-pill">
          <span class="pill-dot"></span>
          <span>OpenAPI 연동 초고속 단축</span>
        </div>
        <h1 class="card-title">길고 복잡한 링크를 단 한 번에</h1>
        <p class="card-desc">긴 웹 주소를 입력하시면 공유하기 편한 깔끔한 단축 URL로 즉시 변환해 드립니다.</p>
      </div>

      <!-- 3-1, 3-2, 3-3: URL 입력 및 단축하기 폼 -->
      <form class="shorten-form" id="shortenForm" autocomplete="off" onsubmit="return false;">
        <div class="input-group">
          <label for="urlInput" class="input-label">URL 입력</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </span>
            <!-- 3-1: 'URL 입력'창 -->
            <input 
              type="text" 
              id="urlInput" 
              class="url-input" 
              placeholder="단축할 긴 URL을 입력하세요 (예: https://www.example.com/long/path/to/page)" 
              autocomplete="off" 
              spellcheck="false"
              required
            >
            <button type="button" class="btn-clear" id="btnClear" title="입력 지우기" aria-label="입력 지우기">✕</button>
          </div>
        </div>

        <!-- 3-1 & 3-2: '단축하기' 버튼 (입력 필드가 비어 있으면 비활성화: disabled) -->
        <button type="submit" class="btn-shorten" id="btnShorten" disabled>
          <span class="btn-text">단축하기</span>
          <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
          <div class="spinner" id="btnSpinner" aria-hidden="true"></div>
        </button>
      </form>

      <!-- 3-1, 3-3, 3-4: 단축 결과 섹션 (읽기 전용 출력 상자 및 복사 버튼) -->
      <section class="result-section" id="resultSection" aria-live="polite">
        <div class="divider">
          <span>단축 완료</span>
        </div>

        <!-- 3-1: 읽기 전용 출력 상자 -->
        <div class="result-box-container">
          <label for="shortUrlOutput" class="result-label">단축된 URL</label>
          <div class="output-wrapper">
            <span class="output-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </span>
            <input 
              type="text" 
              id="shortUrlOutput" 
              class="short-url-output" 
              readonly 
              placeholder="단축된 URL이 여기에 표시됩니다"
              value=""
            >
            <!-- 3-4: '복사' 버튼 -->
            <button type="button" class="btn-copy" id="btnCopy" title="클립보드에 복사">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>복사</span>
            </button>
          </div>
        </div>

        <!-- 액션 버튼 및 연계 기능 -->
        <div class="result-actions">
          <a href="#" target="_blank" rel="noopener noreferrer" class="action-sub-btn" id="btnVisit" title="새 탭에서 열기">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            <span>새 탭에서 열기</span>
          </a>
          <button type="button" class="action-sub-btn qr-connect-btn" id="btnMakeQr" title="이 단축 URL로 QR코드 만들기">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>QR코드로 만들기</span>
          </button>
        </div>

        <!-- 단축 통계 뱃지 (길이 절감율) -->
        <div class="stats-badge" id="statsBadge">
          <span class="stat-item">원래 길이: <strong id="origLen">0</strong>자</span>
          <span class="stat-arrow">→</span>
          <span class="stat-item">단축 길이: <strong id="shortLen">0</strong>자</span>
          <span class="stat-pill" id="reductionPercent">0% 절감</span>
        </div>
      </section>

      <!-- 최근 단축 기록 (히스토리) -->
      <section class="history-section" id="historySection">
        <div class="history-header">
          <span class="history-title">최근 단축 목록</span>
          <button type="button" class="btn-clear-history" id="btnClearHistory">모두 지우기</button>
        </div>
        <ul class="history-list" id="historyList">
          <!-- JS로 동적 추가 -->
        </ul>
      </section>

    </div>
  </main>

  <!-- 3-4: '복사하였습니다' 토스트 알림창 -->
  <div class="toast-popup" id="toastPopup" role="status" aria-live="polite">
    <div class="toast-icon">✓</div>
    <span class="toast-msg" id="toastMessage">복사하였습니다</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
