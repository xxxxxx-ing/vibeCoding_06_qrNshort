<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL2QR - 간편한 QR코드 생성기</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 마우스 반응형 인터랙티브 그라데이션 배경 -->
  <div class="interactive-bg" id="interactiveBg" aria-hidden="true">
    <div class="gradient-mesh"></div>
    <div class="glow-orb orb-primary" id="orbPrimary"></div>
    <div class="glow-orb orb-secondary" id="orbSecondary"></div>
    <div class="glow-orb orb-tertiary" id="orbTertiary"></div>
  </div>

  <!-- 상단 네비게이션 헤더 -->
  <header class="header">
    <div class="header-left">
      <div class="logo-container" id="logoBtn" title="새로운 QR코드 생성하기 (처음으로)">
        <img src="img/logo.png" alt="URL2QR Logo" class="logo-img">
        <span class="logo-badge">QR Generator</span>
      </div>
    </div>

    <!-- 1 & 2 요구사항: QR코드 & URL단축 탭 메뉴 -->
    <nav class="nav-menu" aria-label="메인 메뉴">
      <a href="../index.html" class="nav-btn" title="전체 서비스 홈">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>홈</span>
      </a>
      <a href="index.html" class="nav-btn active" aria-current="page" title="현재 페이지: QR코드 생성">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>QR코드</span>
      </a>
      <a href="../urlShort/index.html" class="nav-btn" title="URL 단축 서비스로 이동">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>URL단축</span>
      </a>
    </nav>
  </header>

  <!-- 메인 영역 -->
  <main class="main-stage">

    <!-- 중앙 QR코드 결과 카드 (생성 전에는 숨김, 생성 후 정중앙에 표시) -->
    <section class="qr-container" id="qrContainer" aria-label="생성된 QR코드">
      <div class="qr-card">
        <!-- 클릭 가능한 QR코드 래퍼 -->
        <div class="qr-interactive-area" id="qrClickArea" role="button" tabindex="0" title="클릭하여 JPG 다운로드">
          <div class="qr-code-box" id="qrcode">
            <canvas id="qrCanvas" width="220" height="220"></canvas>
          </div>
          
          <!-- 호버 시 나타나는 다운로드 오버레이 안내 -->
          <div class="qr-hover-overlay">
            <div class="overlay-content">
              <svg class="overlay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>JPG 다운로드</span>
            </div>
          </div>
        </div>

        <!-- 클릭 안내 뱃지 -->
        <div class="qr-download-notice">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>QR코드를 클릭하면 <strong>JPG 파일</strong>로 저장됩니다</span>
        </div>

        <!-- 연결된 URL 표시 및 액션 버튼 -->
        <div class="qr-details">
          <div class="url-badge" id="qrUrlDisplay" title="">
            <span class="url-text" id="urlTextPreview"></span>
          </div>
          <div class="card-actions">
            <button type="button" class="action-btn download-btn" id="btnManualDownload">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              JPG 저장
            </button>
            <button type="button" class="action-btn copy-btn" id="btnCopyUrl">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              URL 복사
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- URL 입력창 섹션 (초기: 정중앙 -> 생성 후: 화면 하단으로 부드럽게 이동) -->
    <section class="input-panel" id="inputPanel">
      <div class="intro-group" id="introGroup">
        <h1 class="hero-title">빠르고 간편한 QR코드 생성</h1>
        <p class="hero-desc">URL 주소를 입력하시면 고화질 QR코드를 즉시 만들어 드립니다.</p>
      </div>

      <form class="search-form" id="urlForm" autocomplete="off" onsubmit="return false;">
        <div class="input-wrapper">
          <span class="link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </span>
          <input 
            type="text" 
            id="urlInput" 
            class="url-input" 
            placeholder="변환할 URL을 입력하세요 (예: https://example.com)" 
            autocomplete="off" 
            spellcheck="false"
            required
          >
          <button type="button" class="btn-clear" id="btnClear" title="입력 지우기" aria-label="입력 지우기">✕</button>
        </div>

        <button type="submit" class="btn-confirm" id="btnConfirm">
          <span>생성하기</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </section>

  </main>

  <!-- 토스트 알림 메시지 -->
  <div class="toast-popup" id="toastPopup" role="status" aria-live="polite"></div>

  <!-- QR코드 라이브러리 (CDN) 및 메인 스크립트 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
